name: Deploy V2 demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "db/**"
      - "package.json"
      - "next.config.ts"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages (enables site if needed)
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage real content for static mode
        run: mkdir -p public/data && cp db/content.json db/regulations.json public/data/

      - name: Stash API route handlers (static export is serverless)
        run: mv src/app/api /tmp/api-stash

      - name: Build static export
        run: STATIC_EXPORT=1 NEXT_PUBLIC_DATA_MODE=static NEXT_PUBLIC_BASE_PATH=${{ steps.pages.outputs.base_path }} npm run build:static
        env:
          DATABASE_URL: file:./db/custom.db

      - name: Restore API route handlers
        if: always()
        run: mv /tmp/api-stash src/app/api || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
